<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17171f" />
  <meta name="description" content="Personal AI — retro terminal chat" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>personal_ai</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

<!-- CRT overlays -->
<div class="crt-scanlines" aria-hidden="true"></div>
<div class="crt-rollbar crt-flicker" aria-hidden="true"></div>
<div class="crt-vignette" aria-hidden="true"></div>
<div class="crt-chroma" aria-hidden="true"></div>

<!-- App shell: sidebar + main laid out side-by-side on desktop -->
<div id="app">

<!-- Sidebar -->
<aside id="sidebar" role="navigation" aria-label="Conversations">
  <div class="sidebar-header">
    <div class="logo-row">
      <span class="logo-bracket">[</span>
      <span class="logo-name">personal_ai</span>
      <span class="logo-bracket">]</span>
      <span class="logo-cursor" aria-hidden="true"></span>
    </div>
    <div class="logo-sub">session&nbsp;//&nbsp;terminal</div>
  </div>

  <div class="sidebar-toolbar">
    <button id="new-chat-btn" class="cmd-btn" title="New chat" aria-label="New chat">
      <span class="plus">+</span> <span>new</span> <span class="k">^N</span>
    </button>
  </div>

  <div class="search-wrap">
    <span class="search-prefix" aria-hidden="true">/</span>
    <input
      id="search-input"
      type="search"
      placeholder="grep chats..."
      autocomplete="off"
      spellcheck="false"
      aria-label="Search conversations"
    />
  </div>

  <div class="history-label" aria-hidden="true">history</div>

  <div id="conversation-list" role="list" aria-label="Chat history"></div>

  <div id="search-results" class="search-results hidden" role="list" aria-label="Search results"></div>

  <div class="sidebar-footer">
    <label class="incognito-toggle" title="Incognito — chats won't be saved">
      <input type="checkbox" id="incognito-checkbox" aria-label="Incognito mode" />
      <span class="toggle-track">
        <span class="toggle-label">▓ incognito</span>
      </span>
    </label>
    <span class="version-tag">v1.0</span>
  </div>
</aside>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay hidden" aria-hidden="true"></div>

<!-- Main area -->
<main id="main">

  <!-- Tools warning banner -->
  <div id="tools-warning" class="tools-warning hidden" role="alert">
    <span id="tools-warning-text">this model does not support tools</span>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <button id="hamburger" class="btn-icon" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="sidebar"></button>

    <div class="topbar-center">
      <div class="model-select-wrap" id="model-dropdown-wrap">
        <span class="model-prefix" aria-hidden="true">model:&nbsp;</span>
        <div class="model-dropdown" id="model-dropdown" role="combobox" aria-haspopup="listbox" aria-expanded="false">
          <button class="model-trigger" id="model-trigger" type="button" aria-label="Select AI model">
            <span id="model-trigger-text">loading...</span>
            <svg class="model-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
          </button>
          <div class="model-dropdown-panel hidden" id="model-panel" role="listbox">
            <div class="model-search-wrap">
              <input type="text" id="model-search" class="model-search-input" placeholder="filter models..." autocomplete="off" spellcheck="false" aria-label="Filter models" />
            </div>
            <div class="model-list" id="model-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="incognito-badge" class="incognito-badge hidden" aria-live="polite">
      <span>incognito</span>
    </div>

    <button id="settings-btn" class="btn-icon" title="System prompt" aria-label="System prompt settings"></button>
  </header>

  <!-- Chat viewport -->
  <div id="chat-viewport" role="log" aria-live="polite" aria-label="Chat messages">
    <div id="empty-state" class="empty-state">
      <div class="empty-prompt">
        <span class="empty-text">type a message</span>
        <span class="empty-blink" aria-hidden="true"></span>
      </div>
    </div>
    <div id="messages-container"></div>
  </div>

  <!-- Image preview strip -->
  <div id="upload-preview" class="upload-preview hidden" role="region" aria-label="Image upload preview">
    <div id="preview-inner"></div>
    <button id="clear-upload" class="btn-clear-upload" aria-label="Remove image">✕ remove</button>
  </div>

  <!-- Input bar -->
  <div id="input-bar" role="form" aria-label="Send message">
    <button id="upload-btn" class="btn-icon hidden" title="Attach image" aria-label="Attach image"></button>
    <input type="file" id="file-input" accept="image/*" hidden aria-label="Choose image file" />

    <div class="input-wrap">
      <span class="input-prompt" aria-hidden="true">
        <span class="host">you</span><span class="sep">@</span><span class="path">local</span><span class="sep">:~$</span>&nbsp;
      </span>
      <textarea
        id="message-input"
        placeholder="type a message, shift+enter for newline..."
        rows="1"
        spellcheck="false"
        autocomplete="off"
        aria-label="Message input"
      ></textarea>
    </div>

    <button id="send-btn" class="btn-send" aria-label="Send message" title="Send (Enter)"></button>
  </div>

</main>

</div><!-- #app -->

<!-- Settings modal -->
<div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="settings-title" class="modal-title">// system_prompt</h2>
      <button id="settings-close" class="btn-icon" aria-label="Close settings">✕</button>
    </div>
    <textarea
      id="system-prompt-input"
      placeholder="You are a helpful assistant..."
      rows="8"
      spellcheck="false"
      aria-label="System prompt"
    ></textarea>
    <div class="modal-reasoning">
      <label class="reasoning-label" for="reasoning-toggle">
        <span class="reasoning-text">
          <span class="reasoning-name">enable reasoning / thinking</span>
          <span class="reasoning-desc">models that support extended thinking (slower, uses more tokens)</span>
        </span>
        <div class="toggle-switch">
          <input type="checkbox" id="reasoning-toggle" />
          <span class="toggle-knob"></span>
        </div>
      </label>
    </div>
    <div class="modal-footer">
      <span class="modal-hint">applies to current conversation</span>
      <button id="settings-save" class="btn-primary">save</button>
    </div>
  </div>
</div>

<!-- Tweaks FAB + panel -->
<button id="tweaks-fab" title="CRT Tweaks" aria-label="Open CRT tweaks">⚙</button>

<div id="tweaks" role="dialog" aria-label="CRT tweaks">
  <div class="tweaks-header">
    <span class="tweaks-title">TWEAKS</span>
    <button class="tweaks-close" id="tweaks-close">✕</button>
  </div>
  <div class="tweaks-body">

    <div class="tweak-row">
      <div class="tweak-label"><span>CRT intensity</span><span class="val" id="v-crt">medium</span></div>
      <div class="tweak-seg" data-tweak="crt">
        <button data-val="subtle">subtle</button>
        <button data-val="medium" class="active">medium</button>
        <button data-val="full">full</button>
      </div>
    </div>

    <div class="tweak-row">
      <div class="tweak-label"><span>phosphor</span><span class="val" id="v-phos">retro</span></div>
      <div class="tweak-seg" data-tweak="phos">
        <button data-val="retro" class="active">retro</button>
        <button data-val="amber">amber</button>
        <button data-val="green">green</button>
      </div>
    </div>

    <div class="tweak-row">
      <div class="tweak-label"><span>scanline gap</span><span class="val" id="v-scan">3px</span></div>
      <input type="range" min="2" max="6" step="1" value="3" class="tweak-range" id="r-scan" aria-label="Scanline gap" />
    </div>

    <div class="tweak-row">
      <div class="tweak-label"><span>teletype speed</span><span class="val" id="v-tt">instant</span></div>
      <input type="range" min="0" max="30" step="2" value="0" class="tweak-range" id="r-tt" aria-label="Teletype speed" />
    </div>

    <div class="tweak-row">
      <label class="tweak-check">
        <input type="checkbox" id="c-flicker" checked />
        <span class="box"></span>
        <span class="text">screen flicker</span>
      </label>
    </div>

  </div>
  <div class="tweaks-footer">// settings persist to localStorage</div>
</div>

<!-- Scripts -->
<script type="module" src="/static/js/app.js"></script>

</body>
</html>
